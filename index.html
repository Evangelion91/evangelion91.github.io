<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>hey 🖤</title>
<style>
:root{color-scheme:dark;--bg:#17141a;--bubble:#29232d;--text:#f4edf4;--muted:#b6aab8;--accent:#b72e73}
*{box-sizing:border-box}[hidden]{display:none!important}html{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font:16.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100svh;max-width:470px;margin:auto;padding:32px 22px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
header{display:flex;align-items:center;gap:12px;margin-bottom:26px}.avatar{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#443849;font-weight:750;font-size:20px}.name{font-weight:750}.status{color:var(--muted);font-size:13px}.status:before{content:'●';color:#60ba78;margin-right:5px}
.bubble,.photo,.action,.after{opacity:0;transform:translateY(10px)}.bubble{background:var(--bubble);border-radius:20px 20px 20px 6px;padding:13px 18px;max-width:88%;margin-bottom:12px}.photo{width:246px;max-width:85%;padding:8px;background:#272129;border-radius:16px;transform:translateY(10px) rotate(-1.6deg);margin:4px 0 16px}.photo img{display:block;width:100%;height:220px;object-fit:cover;object-position:center 20%;border-radius:10px}.photo .placeholder{height:220px;border-radius:10px;background:linear-gradient(145deg,#493a49,#241d2a);display:grid;place-items:center;color:#c9b4c4;font-size:32px}.caption{text-align:center;font-size:14px;color:#d0c3ce;padding:6px 2px 2px}
.action{display:inline-block;background:var(--accent);color:white;text-decoration:none;border:0;border-radius:999px;font:inherit;font-weight:750;padding:15px 34px;cursor:pointer}.action:hover{background:#98235d}.action:focus-visible{outline:3px solid #fff;outline-offset:4px}.action[aria-disabled=true]{cursor:default;opacity:.55!important}.after{color:var(--muted);font-size:15px;margin-top:14px}.show{animation:appear .42s cubic-bezier(.2,.8,.2,1) forwards}.photo.show{animation:photo-in .42s cubic-bezier(.2,.8,.2,1) forwards}@keyframes appear{to{opacity:1;transform:translateY(0)}}@keyframes photo-in{to{opacity:1;transform:translateY(0) rotate(-1.6deg)}}
.typing{display:flex;gap:5px;align-items:center;background:var(--bubble);border-radius:20px 20px 20px 6px;padding:17px 18px;margin-bottom:12px}.typing span{width:7px;height:7px;border-radius:50%;background:#a194a4;animation:pulse 1.1s infinite}.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}@keyframes pulse{0%,70%,100%{opacity:.3}35%{opacity:1}}
@media(max-height:700px){main{justify-content:flex-start}.photo img,.photo .placeholder{height:160px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header><div class="avatar" id="avatar" aria-hidden="true">♡</div><div><div class="name" id="name">Hey 🖤</div><div class="status">a little message for you</div></div></header>
<div class="bubble step" hidden>hey 👀</div>
<div class="bubble step" hidden>I have something you might like… 🥹</div>
<div class="photo step" id="photo" hidden><div class="placeholder" aria-hidden="true">♡</div><div class="caption">a little peek ↑</div></div>
<div class="bubble step" hidden>come take a look for yourself 🤞</div>
<div class="typing" aria-label="typing"><span></span><span></span><span></span></div>
<a class="action" id="action" aria-disabled="true" hidden>show me 🖤</a>
<div class="after" hidden>…see you there.</div>
</main>
<script>
// Set these values once the page details are provided.
const settings = { name: 'Hey 🖤', initial: '♡', photo: '', target: '' };
document.getElementById('name').textContent = settings.name;
document.getElementById('avatar').textContent = settings.initial;
if(settings.photo){const img=document.createElement('img');img.src=settings.photo;img.alt='';document.querySelector('.placeholder').replaceWith(img)}
const action=document.getElementById('action');
if(settings.target){action.href=settings.target;action.removeAttribute('aria-disabled')}
const steps=[...document.querySelectorAll('.step')],typing=document.querySelector('.typing');
function reveal(index){if(index===steps.length){typing.remove();action.hidden=false;document.querySelector('.after').hidden=false;action.classList.add('show');document.querySelector('.after').classList.add('show');return}typing.before(steps[index]);steps[index].hidden=false;steps[index].classList.add('show');setTimeout(()=>reveal(index+1),window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:850)}
setTimeout(()=>reveal(0),window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:500);
</script>
</body>
</html>
